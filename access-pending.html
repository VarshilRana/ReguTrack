<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f9f7"><title>Access Pending | ReguTrack</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f9f7;color:#172c25;font-family:'DM Sans',sans-serif;padding:24px}.card{max-width:520px;background:#fff;border:1px solid #e8eee9;border-radius:18px;padding:38px;box-shadow:0 8px 28px rgba(28,62,45,.055);text-align:center}.mark{width:54px;height:54px;border-radius:15px;margin:0 auto 18px;background:linear-gradient(145deg,#1b9a68,#087348);color:#fff;display:grid;place-items:center;font:800 25px Manrope}.eyebrow{font-size:10px;letter-spacing:1.6px;color:#16845b;font-weight:800}.card h1{font:800 25px Manrope;margin:10px 0}.card p{font-size:13px;line-height:1.7;color:#7c8b84}.btn{display:inline-block;margin-top:18px;padding:11px 17px;background:#16845b;color:#fff;text-decoration:none;border-radius:9px;font-weight:700;font-size:12px}</style></head><body><main class="card"><div class="mark">R</div><div class="eyebrow">REGUTRACK ACCOUNT</div><h1>Workspace access is pending</h1><p>Your account is signed in, but no eligible ReguTrack workspace role could be verified. Contact the administrator to request access. New account roles are assigned by the database and cannot be selected during signup.</p><a class="btn" href="#" id="signOut">Sign out</a></main><script type="module">import { supabase } from "./js/supabaseClient.js";document.getElementById("signOut").addEventListener("click",async event=>{event.preventDefault();await supabase.auth.signOut();window.location.replace("auth.html?mode=login")});</script></body></html>
